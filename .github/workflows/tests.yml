name: CPU contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test dependencies (image fixtures)
        run: python -m pip install numpy pillow
      - name: Core and provider contracts (no GPU or external model calls)
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -v
      - name: Fixture harness smoke test
        run: python scripts/run_harness.py --mode fixture --planner fixture --fail-first
