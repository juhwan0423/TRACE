<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRACE · 자세 판독</title>
<style>body{font-family:system-ui,sans-serif;background:#eef2f6;color:#172235;max-width:1040px;margin:24px auto;padding:0 18px}h1{font-size:25px;margin-bottom:8px}.panel{background:white;border:1px solid #d7dfe9;border-radius:14px;padding:18px;margin:15px 0}header,nav{display:flex;align-items:center;justify-content:space-between;gap:12px}#photo{display:block;width:100%;height:auto;background:#172235}button{padding:12px 20px;border:1px solid #bac5d4;border-radius:8px;background:white;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}.primary{background:#155ec3;color:white;border-color:#155ec3}fieldset{border:0;display:flex;gap:24px;flex-wrap:wrap;padding:10px 0}fieldset label{padding:12px;background:#f1f5fa;border-radius:8px}textarea{width:100%;box-sizing:border-box;min-height:50px;font:inherit;margin:10px 0}#message{min-height:26px;color:#136745}.muted{color:#526173;font-size:14px}a{color:#155ec3}</style>
<header><div><h1>영상에서 자세를 읽을 수 있나요?</h1><div class="muted">원본 영상만 보고 판단하세요. 모델 답변과 검출 박스는 표시하지 않습니다.</div></div><strong id="progress">불러오는 중</strong></header>
<div class="panel"><strong>판독 기준</strong><div>서 있음: 몸통·다리 방향으로 서 있는 자세가 확인됨.<br>누워 있음: 몸통이 바닥을 따라 놓인 자세가 확인됨.<br>판독 불가: 사람이 없거나, 일부만 보이거나, 자세가 불확실함. 추측하지 마세요.</div></div>
<div class="panel"><header><strong id="case"></strong><span class="muted">이미지는 원본 비율로 확대 표시됩니다.</span></header><img id="photo" alt="판독할 원본 영상"><form id="form"><fieldset><label><input type="radio" name="posture" value="standing"> 서 있음</label><label><input type="radio" name="posture" value="lying"> 누워 있음</label><label><input type="radio" name="posture" value="unreadable"> 판독 불가</label></fieldset><label class="muted"><input type="checkbox" id="exposure"> 이전에 본 장면으로 기억남</label><textarea id="note" maxlength="2000" placeholder="메모 (선택): 가림, 잘림, 사람이 안 보임 등"></textarea><nav><button type="button" id="prev">이전</button><button class="primary" id="save" type="submit">저장 · 다음</button><button type="button" id="next">다음 (저장 안 함)</button></nav></form></div><div id="message" role="status"></div><a href="/export" download="posture_annotations.json">판독 기록 백업 다운로드</a><p class="muted">한 탭에서 작업하세요. 저장된 선택은 다시 열어도 유지됩니다. 전체 항목이 저장되면 판독 완료입니다.</p>
<script>
const token='__TOKEN__';let cases=[],annotations={},index=0,busy=false;
const $=id=>document.getElementById(id);
function draw(){const id=cases[index],a=annotations[id]||{};$('case').textContent=`${id} · ${index+1} / ${cases.length}`;$('progress').textContent=`저장 ${Object.keys(annotations).length} / ${cases.length}`;$('photo').src='/image/'+id;document.querySelectorAll('[name=posture]').forEach(r=>r.checked=r.value===a.posture);$('exposure').checked=!!a.prior_exposure;$('note').value=a.note||'';$('prev').disabled=index===0;$('next').disabled=index===cases.length-1;}
$('prev').onclick=()=>{if(!busy&&index>0){index--;draw();$('message').textContent='';}};
$('next').onclick=()=>{if(!busy&&index<cases.length-1){index++;draw();$('message').textContent='';}};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const selected=document.querySelector('[name=posture]:checked');if(!selected){$('message').textContent='자세 또는 판독 불가를 선택하세요.';return;}busy=true;$('save').disabled=true;try{const id=cases[index];const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Annotation-Token':token},body:JSON.stringify({id,annotation:{posture:selected.value,prior_exposure:$('exposure').checked,note:$('note').value}})});const data=await r.json();if(!r.ok)throw Error(data.error);annotations[id]=data.annotation;const remaining=cases.findIndex((c,i)=>i>index&&!annotations[c]);const any=cases.findIndex(c=>!annotations[c]);index=remaining>=0?remaining:any>=0?any:index;draw();$('message').textContent=any<0?'모든 영상이 저장됐습니다. 이제 채팅에서 “판독 끝났어”라고 알려주세요.':'저장했습니다.';}catch(err){$('message').textContent='저장 실패: '+err.message;}finally{busy=false;$('save').disabled=false;}};
fetch('/api/state').then(r=>{if(!r.ok)throw Error('불러오기 실패');return r.json();}).then(s=>{cases=s.cases;annotations=s.annotations;index=Math.max(0,cases.findIndex(c=>!annotations[c]));draw();}).catch(e=>$('message').textContent=e.message);
</script></html>
